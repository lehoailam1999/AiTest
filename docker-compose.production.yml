services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD is required in api/.env}"
      POSTGRES_DB: ${POSTGRES_DB:-AITestDb}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-AITestDb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: ${POSTGRES_DB:-AITestDb}
      # Real URL for the in-network postgres service
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-AITestDb}"
      JWT_KEY: "${JWT_KEY:?Error: JWT_KEY is required in api/.env}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?Error: ENCRYPTION_KEY is required in api/.env}"
      JWT_ISSUER: ${JWT_ISSUER:-AITest.API}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-AITest.Client}
      JWT_ACCESS_HOURS: ${JWT_ACCESS_HOURS:-24}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      AITEST_RULE_RETRIEVE_MODE: ${AITEST_RULE_RETRIEVE_MODE:-selective}
      AITEST_RULE_RETRIEVE_E2E: ${AITEST_RULE_RETRIEVE_E2E:-1}
      AITEST_RULE_RETRIEVE_ANALYSIS: ${AITEST_RULE_RETRIEVE_ANALYSIS:-1}
      AITEST_RULE_RETRIEVE_TCGEN: ${AITEST_RULE_RETRIEVE_TCGEN:-1}
    ports:
      - "${API_PORT:-8000}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_prod_data:
