services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: AITestDb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d AITestDb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Python FastAPI backend (M0/M1+). Desktop = React + Tauri (chạy native, không đóng gói ở đây).
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: "host=postgres user=postgres password=postgres dbname=AITestDb port=5432 sslmode=disable TimeZone=UTC"
      JWT_KEY: "AITest-Super-Secret-Key-Min-32-Chars-Long!"
      ENCRYPTION_KEY: "AITest-Encryption-Key-Change-Me-32Chars!"
      JWT_ISSUER: "AITest.API"
      JWT_AUDIENCE: "AITest.Client"
      JWT_ACCESS_HOURS: "8"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:4200"
      # Rule retrieval rollout flags (Phase 3)
      AITEST_RULE_RETRIEVE_MODE: "selective" # full | selective
      AITEST_RULE_RETRIEVE_E2E: "1" # phase4 default: selective ON (set 0 to disable only E2E)
      AITEST_RULE_RETRIEVE_ANALYSIS: "1" # phase4 default: selective ON (set 0 to disable only Analysis)
      AITEST_RULE_RETRIEVE_TCGEN: "1" # phase4 default: selective ON (set 0 to disable only TC-gen)
      # TC gen wall-clock (Cursor oneshot × modules)
      AITEST_TC_E2E_SPEED: "fast"
      AITEST_TC_UNIT_SPEED: "fast"
      AITEST_TC_E2E_FAST_MAX_PER_MODULE: "10"
      AITEST_TC_FANOUT_BATCH_MODULES_CURSOR: "3"
      AITEST_TC_FANOUT_CONCURRENCY_CURSOR: "4"
      AITEST_TC_CURSOR_HIDDEN_CHAT: "0"
    ports:
      - "8000:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
